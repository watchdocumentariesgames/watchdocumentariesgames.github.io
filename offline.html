<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are offline</title>
    <meta name="theme-color" content="#F06292">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
    --primary: #F06292;
    --secondary: #03A9F4;
    --accent: #F9A825;
    --dark-bg: #251B2A;
    --dark-card: #37293E;
    --dark-text: #F3E7F8;
    --dark-border: #4E3B56;
    --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
        body { background: var(--dark-bg); color: var(--dark-text); font-family: var(--font-main); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; margin: 0; }
        h1 { font-size: 2rem; margin-bottom: 1rem; color: #fff; }
        p { color: #888; margin-bottom: 2rem; }
        button { padding: 12px 30px; background: var(--accent); border: none; color: #fff; border-radius: 30px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.2s; }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>No Internet Connection</h1>
    <p>Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
