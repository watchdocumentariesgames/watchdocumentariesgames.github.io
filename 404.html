<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#F06292">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
    --primary: #F06292;
    --secondary: #03A9F4;
    --accent: #F9A825;
    --dark-bg: #251B2A;
    --dark-card: #37293E;
    --dark-text: #F3E7F8;
    --dark-border: #4E3B56;
    --font-main: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
        body { background: var(--dark-bg); color: var(--dark-text); font-family: var(--font-main); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; margin: 0; }
        h1 { font-size: 8rem; margin: 0; color: var(--primary); line-height: 1; }
        p { font-size: 1.5rem; margin-bottom: 2rem; color: #888; }
        a { background: var(--accent); color: white; padding: 12px 30px; text-decoration: none; border-radius: 30px; font-weight: bold; transition: 0.2s; }
        a:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(255, 112, 67, 0.4); }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>Page not found</p>
    <a href="/">Go Home</a>
</body>
</html>
